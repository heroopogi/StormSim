<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>STORMSIM — VR UI Kit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#0A1519;
    --void-2:#0F232B;
    --panel:rgba(19,38,46,0.55);
    --panel-solid:#132630;
    --edge:rgba(163,196,205,0.16);
    --water-deep:#123A4E;
    --water:#2E7B9E;
    --water-light:#7FC2DC;
    --amber:#E8A33D;
    --red:#D6483F;
    --mist:#E7F0F2;
    --mist-dim:#8FA9B0;
    --font-d:'Sora',sans-serif;
    --font-u:'Inter',sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:#060D10;
    font-family:var(--font-u);
    color:var(--mist);
    display:flex;
    flex-direction:column;
    align-items:center;
    min-height:100vh;
    padding:28px 16px 60px;
  }

  /* meta controls — the viewer's tool chrome, deliberately distinct from in-VR styling */
  .meta{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
    margin-bottom:22px;
  }
  .meta-title{
    font-family:var(--font-d);
    font-weight:600;
    font-size:13px;
    letter-spacing:0.04em;
    color:var(--mist-dim);
  }
  .switcher{
    display:flex;
    gap:4px;
    background:#0D1B21;
    border:1px solid rgba(163,196,205,0.12);
    border-radius:100px;
    padding:4px;
  }
  .switcher button{
    all:unset;
    cursor:pointer;
    font-family:var(--font-u);
    font-size:12.5px;
    font-weight:500;
    color:var(--mist-dim);
    padding:8px 15px;
    border-radius:100px;
    transition:color .2s ease, background .2s ease;
  }
  .switcher button.active{
    color:var(--void);
    background:var(--water-light);
  }

  /* the lens frame — simulates looking through the headset */
  .lens{
    position:relative;
    width:min(920px, 92vw);
    aspect-ratio:16/10;
    border-radius:26px;
    overflow:hidden;
    background:radial-gradient(120% 100% at 50% 0%, #1B3844 0%, #0F232B 45%, #060D10 100%);
    box-shadow:0 0 0 1px rgba(163,196,205,0.10), 0 30px 70px rgba(0,0,0,0.55);
  }
  .lens::after{
    content:'';
    position:absolute; inset:0;
    box-shadow:inset 0 0 90px 18px rgba(0,0,0,0.65);
    pointer-events:none;
    border-radius:26px;
  }

  .screen{
    position:absolute; inset:0;
    display:none;
    align-items:center;
    justify-content:center;
  }
  .screen.active{ display:flex; }

  /* ---------- shared bits ---------- */
  .glass{
    background:var(--panel);
    border:1px solid var(--edge);
    backdrop-filter:blur(14px);
    border-radius:18px;
  }
  .icon{ display:block; }
  .label{
    font-family:var(--font-u);
    font-size:12px;
    font-weight:500;
    color:var(--mist-dim);
    letter-spacing:0.01em;
  }

  /* ================= MAIN MENU ================= */
  #menu{ flex-direction:column; gap:30px; }
  .wordmark{
    display:flex; flex-direction:column; align-items:center; gap:10px;
  }
  .wordmark svg{ width:34px; height:34px; }
  .wordmark h1{
    font-family:var(--font-d);
    font-weight:700;
    font-size:30px;
    letter-spacing:0.02em;
    color:var(--mist);
  }
  .wordmark .place{
    font-size:11.5px;
    color:var(--mist-dim);
    letter-spacing:0.03em;
  }
  .menu-actions{ display:flex; gap:22px; }
  .orb{
    position:relative;
    width:64px; height:64px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:rgba(127,194,220,0.08);
    border:1px solid var(--edge);
    cursor:pointer;
    transition:transform .18s ease, background .18s ease, border-color .18s ease;
  }
  .orb:hover{ transform:translateY(-3px); background:rgba(127,194,220,0.16); border-color:rgba(127,194,220,0.5); }
  .orb svg{ width:24px; height:24px; stroke:var(--mist); }
  .orb.primary{ width:78px; height:78px; background:var(--water-light); border-color:transparent; }
  .orb.primary svg{ stroke:var(--void); width:26px; height:26px; }
  .orb .tip{
    position:absolute; top:calc(100% + 9px);
    font-size:11px; color:var(--mist-dim);
    opacity:0; transition:opacity .18s ease;
    white-space:nowrap;
  }
  .orb:hover .tip{ opacity:1; }

  /* ================= HUD ================= */
  #hud{ align-items:stretch; justify-content:flex-end; flex-direction:column; }
  .horizon{
    position:absolute; inset:0;
    background:
      linear-gradient(180deg, #16323D 0%, #1E4B5C 38%, #2E7B9E 60%, #123A4E 100%);
  }
  .silhouette{ position:absolute; left:0; right:0; bottom:34%; height:16%; opacity:0.55; }
  .gauge-wrap{
    position:absolute; top:22px; left:50%; transform:translateX(-50%);
    display:flex; flex-direction:column; align-items:center; gap:4px;
  }
  .waterbar{
    position:absolute; right:22px; top:50%; transform:translateY(-50%);
    width:10px; height:150px; border-radius:6px;
    background:rgba(6,13,16,0.4); border:1px solid var(--edge);
    display:flex; align-items:flex-end; padding:3px;
  }
  .waterbar-fill{
    width:100%; height:62%; border-radius:5px;
    background:linear-gradient(180deg, var(--water-light), var(--water));
  }
  .dock{
    position:relative;
    align-self:center;
    margin-bottom:22px;
    display:flex; gap:10px;
    padding:10px;
  }
  .dock .orb{ width:52px; height:52px; background:rgba(6,13,16,0.45); }
  .dock .orb svg{ width:20px; height:20px; }

  /* ================= DECISION ================= */
  #decision .horizon{ filter:brightness(0.45) saturate(0.8); }
  .card{
    position:relative;
    width:380px;
    padding:26px 24px 22px;
    display:flex; flex-direction:column; align-items:center; gap:16px;
    text-align:center;
  }
  .ring-timer{
    width:38px; height:38px;
    margin:0 auto;
  }
  .prompt-text{
    font-family:var(--font-d);
    font-size:16.5px;
    font-weight:600;
    color:var(--mist);
    max-width:280px;
    line-height:1.4;
  }
  .choices{ display:flex; gap:12px; width:100%; }
  .choice{
    flex:1;
    display:flex; flex-direction:column; align-items:center; gap:8px;
    padding:16px 8px;
    border-radius:14px;
    border:1px solid var(--edge);
    background:rgba(127,194,220,0.05);
    cursor:pointer;
    transition:background .18s ease, border-color .18s ease;
  }
  .choice:hover{ background:rgba(127,194,220,0.14); border-color:rgba(127,194,220,0.5); }
  .choice svg{ width:22px; height:22px; stroke:var(--water-light); }
  .choice span{ font-size:12px; color:var(--mist); font-weight:500; }

  /* ================= ALERT ================= */
  #alert .horizon{ background:linear-gradient(180deg, #2B1414 0%, #401616 45%, #200D0D 100%); }
  .alert-core{
    display:flex; flex-direction:column; align-items:center; gap:14px;
  }
  .siren{
    position:relative;
    width:96px; height:96px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:rgba(214,72,63,0.14);
    border:1px solid rgba(214,72,63,0.5);
  }
  .siren::before, .siren::after{
    content:'';
    position:absolute; inset:0;
    border-radius:50%;
    border:1px solid rgba(214,72,63,0.45);
    animation:pulse 2.2s ease-out infinite;
  }
  .siren::after{ animation-delay:1.1s; }
  @keyframes pulse{
    0%{ transform:scale(1); opacity:0.9; }
    100%{ transform:scale(1.9); opacity:0; }
  }
  .siren svg{ width:34px; height:34px; stroke:var(--red); }
  .alert-text{
    font-family:var(--font-d);
    font-weight:700;
    font-size:20px;
    letter-spacing:0.01em;
  }
  .alert-sub{ display:flex; align-items:center; gap:6px; color:var(--mist-dim); font-size:12px; }
  .alert-sub svg{ width:14px; height:14px; stroke:var(--mist-dim); }

  /* ================= DEBRIEF ================= */
  #debrief .horizon{ background:radial-gradient(120% 100% at 50% 0%, #1B3844 0%, #0F232B 55%, #060D10 100%); }
  .debrief-wrap{ display:flex; flex-direction:column; align-items:center; gap:20px; }
  .score-ring{ position:relative; width:150px; height:150px; }
  .score-ring svg{ width:100%; height:100%; transform:rotate(-90deg); }
  .score-ring .bg{ stroke:rgba(163,196,205,0.14); }
  .score-ring .fg{ stroke:var(--water-light); stroke-linecap:round; }
  .score-center{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .score-center strong{ font-family:var(--font-d); font-size:30px; font-weight:700; }
  .score-center span{ font-size:10.5px; color:var(--mist-dim); letter-spacing:0.04em; }
  .recap{ display:flex; gap:14px; }
  .recap-item{ display:flex; flex-direction:column; align-items:center; gap:6px; }
  .recap-badge{
    width:36px; height:36px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    border:1px solid var(--edge);
  }
  .recap-badge.good{ background:rgba(127,194,220,0.12); }
  .recap-badge.bad{ background:rgba(214,72,63,0.12); }
  .recap-badge svg{ width:16px; height:16px; }
  .recap-badge.good svg{ stroke:var(--water-light); }
  .recap-badge.bad svg{ stroke:var(--red); }

  .footnote{
    margin-top:20px;
    font-size:11.5px;
    color:#4E6067;
    text-align:center;
    max-width:520px;
    line-height:1.5;
  }
</style>
</head>
<body>

  <div class="meta">
    <div class="meta-title">STORMSIM — VR UI KIT</div>
    <div class="switcher" id="switcher">
      <button data-screen="menu" class="active">Main Menu</button>
      <button data-screen="hud">In-VR HUD</button>
      <button data-screen="decision">Decision</button>
      <button data-screen="alert">Flood Alert</button>
      <button data-screen="debrief">Debrief</button>
    </div>
  </div>

  <div class="lens">

    <!-- MAIN MENU -->
    <div class="screen active" id="menu">
      <div class="wordmark">
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--water-light)" stroke-width="1.6">
          <path d="M12 2 C8 8 5 11 5 15a7 7 0 0 0 14 0c0-4-3-7-7-13z"/>
        </svg>
        <h1>STORMSIM</h1>
        <div class="place">Purok Baybayon · Barangay Banago</div>
      </div>
      <div class="menu-actions">
        <div class="orb">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 12l7-7v14z"/><path d="M11 5l7 7-7 7"/></svg>
          <span class="tip">Locations</span>
        </div>
        <div class="orb primary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 5l11 7-11 7z"/></svg>
          <span class="tip">Play</span>
        </div>
        <div class="orb">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 9 19.36a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.64 15a1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.64 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.64a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.36 9c.1.36.5.98 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1z"/></svg>
          <span class="tip">Settings</span>
        </div>
      </div>
    </div>

    <!-- HUD -->
    <div class="screen" id="hud">
      <div class="horizon"></div>
      <svg class="silhouette" viewBox="0 0 400 60" preserveAspectRatio="none">
        <path d="M0 60 L0 40 L20 40 L20 30 L40 30 L40 40 L70 40 L70 25 L90 25 L90 40 L130 40 L130 32 L150 32 L150 40 L400 40 L400 60 Z" fill="#0B1B22"/>
      </svg>

      <div class="gauge-wrap">
        <svg width="60" height="34" viewBox="0 0 60 34">
          <path d="M4 30 A26 26 0 0 1 56 30" fill="none" stroke="rgba(163,196,205,0.18)" stroke-width="4" stroke-linecap="round"/>
          <path d="M4 30 A26 26 0 0 1 40 6" fill="none" stroke="var(--amber)" stroke-width="4" stroke-linecap="round"/>
        </svg>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--mist-dim)" stroke-width="1.8"><path d="M17.5 19a4.5 4.5 0 0 0 0-9 6 6 0 0 0-11.4-1.5A5 5 0 0 0 6.5 19h11z"/></svg>
      </div>

      <div class="waterbar">
        <div class="waterbar-fill"></div>
      </div>

      <div class="dock glass">
        <div class="orb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2"/><path d="M12 12l4-6-6 4z"/></svg></div>
        <div class="orb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 7l5-2 6 2 5-2v14l-5 2-6-2-5 2z"/><path d="M9 5v14M15 7v14"/></svg></div>
        <div class="orb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 21l6-15 6 15"/><path d="M6 14h6"/><path d="M15 21V8a6 6 0 0 1 6-6"/></svg></div>
      </div>
    </div>

    <!-- DECISION -->
    <div class="screen" id="decision">
      <div class="horizon"></div>
      <div class="card glass">
        <svg class="ring-timer" viewBox="0 0 36 36">
          <circle cx="18" cy="18" r="15" fill="none" stroke="rgba(163,196,205,0.18)" stroke-width="3"/>
          <circle cx="18" cy="18" r="15" fill="none" stroke="var(--amber)" stroke-width="3" stroke-linecap="round" stroke-dasharray="70 94" transform="rotate(-90 18 18)"/>
        </svg>
        <p class="prompt-text">Water is rising over the main road.</p>
        <div class="choices">
          <div class="choice">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 19c2-1 3 1 5 0s3 1 5 0 3 1 5 0 2 1 3 0"/><path d="M6 14l1-6M12 15l1-7M18 14l1-5"/></svg>
            <span>Wade through</span>
          </div>
          <div class="choice">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 21V9l8-6 8 6v12"/><path d="M9 21v-6h6v6"/><path d="M15 3l4 2"/></svg>
            <span>Find a detour</span>
          </div>
        </div>
      </div>
    </div>

    <!-- ALERT -->
    <div class="screen" id="alert">
      <div class="horizon"></div>
      <div class="alert-core">
        <div class="siren">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 2a7 7 0 0 0-7 7v5l-2 3h18l-2-3v-5a7 7 0 0 0-7-7z"/><path d="M9.5 19a2.5 2.5 0 0 0 5 0"/></svg>
        </div>
        <div class="alert-text">Evacuate now</div>
        <div class="alert-sub">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          Follow the marked route
        </div>
      </div>
    </div>

    <!-- DEBRIEF -->
    <div class="screen" id="debrief">
      <div class="horizon"></div>
      <div class="debrief-wrap">
        <div class="score-ring">
          <svg viewBox="0 0 150 150">
            <circle class="bg" cx="75" cy="75" r="64" fill="none" stroke-width="10"/>
            <circle class="fg" cx="75" cy="75" r="64" fill="none" stroke-width="10" stroke-dasharray="402" stroke-dashoffset="90"/>
          </svg>
          <div class="score-center">
            <strong>78</strong>
            <span>PREPAREDNESS</span>
          </div>
        </div>
        <div class="recap">
          <div class="recap-item">
            <div class="recap-badge good"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12l5 5 11-11"/></svg></div>
          </div>
          <div class="recap-item">
            <div class="recap-badge good"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12l5 5 11-11"/></svg></div>
          </div>
          <div class="recap-item">
            <div class="recap-badge bad"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg></div>
          </div>
          <div class="recap-item">
            <div class="recap-badge good"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12l5 5 11-11"/></svg></div>
          </div>
        </div>
      </div>
    </div>

  </div>

  <div class="footnote">Icon-led, gaze-height panels — designed to stay legible without dense text in a VR headset.</div>

<script>
  document.getElementById('switcher').addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if(!btn) return;
    document.querySelectorAll('.switcher button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(btn.dataset.screen).classList.add('active');
  });
</script>

</body>
</html>
